<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hexa Space Directory</title>
<!--
  Standalone lobby-TV directory board. Deliberately dependency-free and written
  in old-browser-safe ES5 (var / function / XMLHttpRequest, no optional chaining,
  no arrow functions) so it renders on Samsung Tizen and other older smart-TV
  browsers that white-screen on the modern React bundle.

  Usage: /tv.html?level=4 · 2 · 5 · G
  Reads the boards from the public (anon read-only) directory_boards table and
  re-fetches every 30s, so admin edits reach the screen without touching the TV.

  Level G is the ground-floor building board: every floor side by side, with the
  Hexa floors borrowing their suites from the level boards. The ground floor has
  no internet, so that board is normally carried down as an exported HTML/PNG
  file from Admin → Directory — this page is the online preview of it.

  Markup mirrors src/lib/directoryHtml.js (which drives the admin exports and
  /directory/<level>). Keep the two in step when the design changes; this copy
  stays ES5 + old-CSS on purpose.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0c; }
  * { box-sizing: border-box; }
  body {
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;   /* kiosk: never scroll — the board is scaled to fit */
  }
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background-color: #14151a;
    background-image:
      radial-gradient(115% 75% at 22% 6%, rgba(140,150,170,0.13), rgba(20,21,26,0) 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.016) 0px, rgba(255,255,255,0.016) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 9px),
      radial-gradient(125% 115% at 50% 26%, #1e2126 0%, #14151a 45%, #0a0a0c 100%);
  }
  #bg.lobby {
    background-color: #0b0b0e;
    background-image:
      radial-gradient(90% 60% at 12% 0%, rgba(200,167,94,0.10), rgba(11,11,14,0) 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 9px),
      radial-gradient(120% 110% at 50% 24%, #191919 0%, #111114 48%, #08080a 100%);
  }
  #wrap { position: relative; z-index: 1; width: 1100px; max-width: 100%; margin: 0 auto; padding: 26px 52px 22px; transform-origin: top center; }
  #wrap.lobby { width: 1500px; padding: 40px 56px 26px; }
  .addr { text-align: center; font-size: 12px; letter-spacing: 0.5em; color: #8a8a92; text-transform: uppercase; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 18px; }
  .title { line-height: 0.9; }
  .title .lv { display: block; font-size: 50px; font-weight: 300; letter-spacing: 0.12em; }
  .title .dr { display: block; font-size: 50px; font-weight: 700; letter-spacing: 0.06em; }
  .brand { text-align: right; padding-top: 2px; white-space: nowrap; }
  .brand .n { font-size: 34px; font-weight: 300; letter-spacing: 0.18em; }
  .brand .cn { margin-top: 5px; font-size: 18px; letter-spacing: 0.6em; color: #a7a7ae; }
  .cols { display: flex; margin-top: 22px; padding-bottom: 10px; padding-left: 20px;
          border-bottom: 1px solid rgba(255,255,255,0.10);
          font-size: 12px; letter-spacing: 0.35em; color: #8a8a92; text-transform: uppercase; }
  .cols .c1 { width: 150px; }
  .list { margin-top: 6px; border-left: 1px solid rgba(255,255,255,0.10); }
  .row { display: flex; align-items: flex-start; padding: 9px 0 9px 20px; }
  .row .s { width: 150px; flex: 0 0 150px; font-size: 23px; font-weight: 300; color: #a7a7ae; }
  .row .b { font-size: 23px; font-weight: 300; line-height: 1.2; }
  .row .b .l2 { font-size: 18px; color: #c9c9d0; }
  .comm { margin-top: 26px; }
  .comm .h { text-align: center; font-size: 25px; letter-spacing: 0.35em; text-transform: uppercase; }
  .comm .sh { text-align: center; margin-top: 7px; font-size: 13px; letter-spacing: 0.4em; color: #8a8a92; }
  .comm .grid { margin-top: 18px; -webkit-column-count: 3; -moz-column-count: 3; column-count: 3; -webkit-column-gap: 30px; column-gap: 30px; }
  .comm .item { -webkit-column-break-inside: avoid; break-inside: avoid; font-size: 15px; font-weight: 300;
                color: #c9c9d0; line-height: 1.25; padding-bottom: 7px; margin-bottom: 7px;
                border-bottom: 1px solid rgba(255,255,255,0.06); }
  .foot { margin-top: 26px; text-align: center; font-size: 11px; letter-spacing: 0.4em; color: #55555c; text-transform: uppercase; }
  .msg { position: relative; z-index: 1; text-align: center; padding-top: 40vh; color: #8a8a92; letter-spacing: 0.3em; }

  /* ── ground-floor building board ───────────────────────────────────────── */
  .lb-top { display: -webkit-box; display: flex; -webkit-box-pack: justify; justify-content: space-between;
            -webkit-box-align: start; align-items: flex-start; padding-bottom: 26px; border-bottom: 1px solid rgba(200,167,94,0.22); }
  .lb-bd { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; color: #c8a75e; }
  .lb-bd .mk { width: 58px; height: 44px; margin-right: 16px; }
  .lb-bn { font-size: 34px; font-weight: 400; letter-spacing: 0.22em; color: #fff; }
  .lb-bs { margin-top: 5px; font-size: 12px; letter-spacing: 0.34em; color: #c8a75e; }
  .lb-bs i { display: inline-block; width: 26px; height: 1px; background: #c8a75e; vertical-align: middle; margin: 0 10px; }
  .lb-bc { margin-top: 7px; font-size: 15px; letter-spacing: 0.34em; color: #c8a75e; }
  .lb-tt { text-align: right; line-height: 1.02; }
  .lb-tt .t1 { display: block; font-size: 40px; font-weight: 300; letter-spacing: 0.05em; color: #c8a75e; }
  .lb-tt .t2 { display: block; font-size: 40px; font-weight: 700; letter-spacing: 0.02em; color: #c8a75e; }
  .lb-body { display: -webkit-box; display: flex; margin-top: 28px; -webkit-box-align: start; align-items: flex-start; }
  .lb-col { -webkit-box-flex: 1; flex: 1 1 0%; width: 50%; }
  .lb-col.first { margin-right: 52px; }
  .lb-sec { margin-bottom: 26px; }
  .lb-fl { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; }
  .lb-fl .n { font-size: 40px; font-weight: 700; color: #fff; line-height: 1.1; margin-right: 16px; }
  .lb-fl .ln { -webkit-box-flex: 1; flex: 1 1 auto; height: 1px; background: rgba(255,255,255,0.16); }
  .lb-hd { margin-top: 8px; font-size: 19px; font-weight: 500; color: #c8a75e; }
  .lb-sub { margin-top: 3px; font-size: 13px; color: #9b8a63; }
  .lb-rows { margin-top: 10px; }
  .lb-row { display: -webkit-box; display: flex; -webkit-box-align: start; align-items: flex-start; padding: 4px 0; }
  .lb-row .s { width: 92px; flex: 0 0 92px; font-size: 15px; color: #86868f; padding-top: 3px; }
  .lb-row .b { font-size: 19px; line-height: 1.32; color: #fff; }
  .lb-row .b .l2 { font-size: 19px; color: #fff; }
  .lb-reg { margin-top: 34px; border: 1px solid rgba(200,167,94,0.22); padding: 22px 26px 16px; }
  .lb-rh { display: -webkit-box; display: flex; -webkit-box-pack: justify; justify-content: space-between;
           -webkit-box-align: baseline; align-items: baseline; padding-bottom: 16px; }
  .lb-rh .lead { font-size: 19px; font-weight: 700; letter-spacing: 0.06em; color: #fff; margin-right: 14px; }
  .lb-rh .ttl { font-size: 25px; font-weight: 500; color: #c8a75e; }
  .lb-rh .cn { font-size: 14px; letter-spacing: 0.1em; color: #9b8a63; white-space: nowrap; }
  .lb-rg { -webkit-column-count: 4; -moz-column-count: 4; column-count: 4; -webkit-column-gap: 34px; column-gap: 34px; }
  .lb-rg .item { -webkit-column-break-inside: avoid; break-inside: avoid; font-size: 14px; line-height: 1.3; color: #d2d2d8;
                 padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .lb-foot { display: -webkit-box; display: flex; -webkit-box-pack: justify; justify-content: space-between; margin-top: 22px;
             font-size: 11px; letter-spacing: 0.28em; color: #6c6558; text-transform: uppercase; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"><div class="msg">LOADING DIRECTORY&hellip;</div></div>

<script>
(function () {
  var SUPABASE_URL = "https://ihvhnsdsvjwpyquvetzz.supabase.co";
  var ANON_KEY = "sb_publishable_L390rX9G4rGIguhI-3yApA_TRhFzhVN";
  var REFRESH_MS = 30000;

  function qs(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var LEVELS = { "2": 1, "4": 1, "5": 1, "G": 1 };
  var level = String(qs("level")).toUpperCase();
  if (!LEVELS[level]) level = "4";
  document.title = "Hexa Space Directory — " + (level === "G" ? "Ground" : "Level " + level);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function nameHtml(name) {
    var lines = String(name == null ? "" : name).split("\n");
    var out = esc(lines[0]);
    for (var i = 1; i < lines.length; i++) {
      out += '<div class="l2">' + esc(lines[i]) + "</div>";
    }
    return out;
  }

  // Rows for one floor section of the ground board: typed in by hand, or
  // borrowed from that level's own board so the two can never disagree.
  function sectionRows(section, boards) {
    if (!section) return [];
    if (section.source) {
      var src = boards[section.source];
      var suites = (src && src.suites) || [];
      var out = [];
      for (var i = 0; i < suites.length; i++) {
        var n = String(suites[i].suite == null ? "" : suites[i].suite);
        out.push({ suite: n ? "Suite " + n : "", name: suites[i].name });
      }
      return out;
    }
    return section.rows || [];
  }

  var MARK = '<svg class="mk" viewBox="0 0 64 48">' +
    '<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">' +
    '<path d="M32 42 C13 35 4 24 6 14 C8 5 19 2 25 9 C30 15 32 27 32 42 Z"/>' +
    '<path d="M32 42 C51 35 60 24 58 14 C56 5 45 2 39 9 C34 15 32 27 32 42 Z"/>' +
    "</g></svg>";

  function lobbyHtml(board, boards) {
    var sections = board.sections || [];
    var split = board.columnSplitAfter;
    if (typeof split !== "number") split = Math.ceil(sections.length / 2);
    var title = String(board.title || "EAST\nCOMMERCIAL LOBBY").split("\n");
    var i, j;

    var h = '<div class="lb-top"><div class="lb-bd">' + MARK + "<div>";
    h += '<div class="lb-bn">' + esc(board.buildingName || "PANORAMA") + "</div>";
    if (board.buildingSub) h += '<div class="lb-bs"><i></i>' + esc(board.buildingSub) + "<i></i></div>";
    if (board.buildingCn) h += '<div class="lb-bc">' + esc(board.buildingCn) + "</div>";
    h += '</div></div><div class="lb-tt"><span class="t1">' + esc(title[0]) + "</span>";
    for (i = 1; i < title.length; i++) h += '<span class="t2">' + esc(title[i]) + "</span>";
    h += "</div></div>";

    h += '<div class="lb-body">';
    for (var c = 0; c < 2; c++) {
      var col = c === 0 ? sections.slice(0, split) : sections.slice(split);
      h += '<div class="lb-col' + (c === 0 ? " first" : "") + '">';
      for (i = 0; i < col.length; i++) {
        var sec = col[i], rows = sectionRows(sec, boards);
        h += '<div class="lb-sec"><div class="lb-fl"><span class="n">' + esc(sec.floor) + '</span><span class="ln"></span></div>';
        if (sec.heading) h += '<div class="lb-hd">' + esc(sec.heading) + "</div>";
        if (sec.subheading) h += '<div class="lb-sub">' + esc(sec.subheading) + "</div>";
        h += '<div class="lb-rows">';
        for (j = 0; j < rows.length; j++) {
          h += '<div class="lb-row"><div class="s">' + esc(rows[j].suite) + '</div><div class="b">' + nameHtml(rows[j].name) + "</div></div>";
        }
        h += "</div></div>";
      }
      h += "</div>";
    }
    h += "</div>";

    var comm = board.community || [];
    if (board.showCommunity && comm.length) {
      h += '<div class="lb-reg"><div class="lb-rh"><div>';
      if (board.communityLead) h += '<span class="lead">' + esc(board.communityLead) + "</span>";
      h += '<span class="ttl">' + esc(board.communityHeading || "Registered Businesses") + "</span></div>";
      if (board.communitySubheading) h += '<div class="cn">' + esc(board.communitySubheading) + "</div>";
      h += '</div><div class="lb-rg">';
      for (i = 0; i < comm.length; i++) h += '<div class="item">' + esc(comm[i]) + "</div>";
      h += "</div></div>";
    }

    h += '<div class="lb-foot"><span>' + esc(board.buildingName || "PANORAMA") + " " + esc(board.buildingSub || "") +
         " · " + esc(String(board.title || "").replace(/\n/g, " ")) + "</span><span>Building Directory</span></div>";
    return h;
  }

  function render(board, boards) {
    if (!board) return;
    var lobby = board.layout === "lobby";
    document.getElementById("bg").className = lobby ? "lobby" : "";
    if (lobby) {
      paint(lobbyHtml(board, boards), true);
      return;
    }
    var h = "";
    h += '<div class="addr">' + esc(board.address || "830 WHITEHORSE ROAD · BOX HILL") + "</div>";
    h += '<div class="head">';
    h += '<div class="title"><span class="lv">' + esc(board.levelLabel || ("LEVEL " + level)) + "</span>";
    h += '<span class="dr">DIRECTORY</span></div>';
    h += '<div class="brand"><div class="n">HEXA SPACE</div><div class="cn">六 合 空 间</div></div>';
    h += "</div>";

    h += '<div class="cols"><div class="c1">Suite</div><div>Business Name</div></div>';
    h += '<div class="list">';
    var suites = board.suites || [];
    for (var i = 0; i < suites.length; i++) {
      h += '<div class="row"><div class="s">' + esc(suites[i].suite) + "</div>";
      h += '<div class="b">' + nameHtml(suites[i].name) + "</div></div>";
    }
    h += "</div>";

    var comm = board.community || [];
    if (board.showCommunity && comm.length) {
      h += '<div class="comm"><div class="h">' + esc(board.communityHeading || "COMMUNITY MEMBERS") + "</div>";
      if (board.communitySubheading) h += '<div class="sh">' + esc(board.communitySubheading) + "</div>";
      h += '<div class="grid">';
      for (var j = 0; j < comm.length; j++) {
        h += '<div class="item">' + esc(comm[j]) + "</div>";
      }
      h += "</div></div>";
    }

    h += '<div class="foot">HEXA SPACE · 830 WHITEHORSE ROAD BOX HILL</div>';
    paint(h, false);
  }

  var rendered = false;   // once a board is on screen, never blank it again

  function paint(html, lobby) {
    rendered = true;
    var wrap = document.createElement("div");
    wrap.id = "wrap";
    if (lobby) wrap.className = "lobby";
    wrap.innerHTML = html;
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(wrap);
    fit();
    // re-measure after layout/CJK glyphs settle
    setTimeout(fit, 60);
    setTimeout(fit, 400);
  }

  // Scale the whole board so it always fits the screen — no scrolling, no
  // clipping — whatever the level's content length (L2 has 27 suites, L4 has a
  // long community list). Height is the usual binding constraint; scaling to
  // exactly fill it lands the footer on the bottom edge like the printed board.
  function fit() {
    var wrap = document.getElementById("wrap");
    if (!wrap) return;
    wrap.style.transform = "none";
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var h = wrap.offsetHeight;
    var w = wrap.offsetWidth;
    if (!h || !w) return;
    var scale = Math.min(1, vh / h, vw / w);
    wrap.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
  }

  function load() {
    try {
      var xhr = new XMLHttpRequest();
      // All boards, not just this one: the ground board reads its Hexa floors
      // from the level boards.
      var url = SUPABASE_URL + "/rest/v1/directory_boards?select=id,data";
      xhr.open("GET", url, true);
      xhr.setRequestHeader("apikey", ANON_KEY);
      xhr.setRequestHeader("Authorization", "Bearer " + ANON_KEY);
      // Bust caches without polluting the query (PostgREST reads stray params as
      // column filters) — a request header is safe.
      xhr.setRequestHeader("Cache-Control", "no-cache");
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var rows = JSON.parse(xhr.responseText) || [];
            var boards = {};
            for (var i = 0; i < rows.length; i++) {
              if (rows[i] && rows[i].data) boards[String(rows[i].id)] = rows[i].data;
            }
            if (boards[level]) {
              render(boards[level], boards);
            } else if (!rendered) {
              // The fetch worked, this board just hasn't been saved yet. Say so
              // instead of sitting on "LOADING DIRECTORY…" forever — and keep
              // polling, so it appears by itself once someone hits Save.
              document.getElementById("app").innerHTML =
                '<div class="msg">' + esc(level === "G" ? "GROUND" : "LEVEL " + level) +
                " BOARD NOT PUBLISHED YET<br><br>ADMIN &rarr; DIRECTORY &rarr; SAVE &amp; GENERATE</div>";
            }
          } catch (e) { /* keep last good render */ }
        }
        // on error: leave whatever is on screen (don't blank the TV)
      };
      xhr.send();
    } catch (e) { /* ignore, retry on next tick */ }
  }

  load();
  setInterval(load, REFRESH_MS);
  if (window.addEventListener) window.addEventListener("resize", fit, false);
})();
</script>
</body>
</html>
