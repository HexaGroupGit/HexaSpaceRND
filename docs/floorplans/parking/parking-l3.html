.canvas{position:relative;width:2000px;height:1414px;overflow:hidden;background:#f4f5f9;transform-origin:0 0;

.header{position:absolute;left:40px;top:20px;width:500px;height:170px}
.lvl{position:absolute;left:0;top:0;width:2000px;height:200px;overflow:visible}

.title{position:absolute;right:48px;top:66px;text-align:right}

.title .t2{margin-top:14px;font-size:17px;font-weight:500;letter-spacing:.12em;color:#6d6d78}
.panel{position:absolute;left:62px;top:222px;width:1890px;height:828px;background:#fff}
svg.plan{position:absolute;left:227.0px;top:246.0px;width:1560.0px;height:780.0px;overflow:visible}
svg.plan path,svg.plan rect{vector-effect:non-scaling-stroke}
.zone{fill:#f6f0fc;stroke:none}
.bay-other path{fill:#f6f0fc;stroke:#cdc3da;stroke-width:1.2px;stroke-dasharray:6 4}
.ln-thin path{fill:none;stroke:#a4a4a4;stroke-width:1px}
.ln-med path{fill:none;stroke:#8c8c8c;stroke-width:1.4px}

.place{font-size:7.4px;font-weight:600;fill:#a0a0aa;letter-spacing:.22em}
.street{font-size:8.6px;font-weight:600;fill:#a8a8b2;letter-spacing:.26em}
